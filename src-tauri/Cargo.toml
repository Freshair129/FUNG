[package]
name = "fung"
version = "0.1.0"
default-run = "fung"
description = "FUNG local-first audio intelligence desktop app"
authors = ["Boss"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "fung_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
argon2 = "=0.5.3"
bip39 = "=2.2.2"
chacha20poly1305 = { version = "=0.10.1", features = ["stream"] }
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.16"
hound = "3.5"
curve25519-dalek = "4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
genesis-block-native = { git = "https://github.com/Freshair129/GenesisBlock.git", rev = "1ff6862968d125970008c3c4bd31c9b4260b8c13", default-features = false, features = ["mobile"] }
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
snow = "0.9"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.4.9"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

# Free-space checks before and during capture. Already present transitively;
# declared here because `live_meeting` calls GetDiskFreeSpaceExW directly.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

# --- Local development against a WIP GenesisBlock checkout ---
# Uncomment to build against the local working copy instead of the pinned git rev.
# Never commit this uncommented.
# [patch."https://github.com/Freshair129/GenesisBlock.git"]
# genesis-block-native = { path = "G:/GenesisBlock_Dev/GenesisBlock" }
