name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      # First, so an unwired suite fails before the wired ones spend
      # four minutes reporting on a set that is missing one.
      - run: npm run test:ci-coverage
      - run: npm run test:live-capture-routing
      - run: npm run test:callmd-contracts
      - run: npm run test:callmd-shell
      - run: npm run test:callmd-live
      - run: npm run test:callmd-history
      - run: npm run test:callmd-integration
      - run: npm run test:live-capture-routing
      - run: npm run test:recording-output
      - run: npm run test:mobile
      - run: npm run test:design-system
      - run: npm run test:auth
      - run: npm run test:w1-authority-schema
      # Every suite runs, and `test:ci-coverage` is what makes that a fact
      # rather than a claim. This comment previously asserted it after six
      # unwired suites were found, and was wrong when written: test:release
      # already existed and was missed by the same sweep.
      - run: npm run test:backup-flow
      - run: npm run test:device-reconcile
      - run: npm run test:desktop-bootstrap
      - run: npm run test:release
      - run: npm run test:meeting-intelligence-contract
      - run: npm run test:external-tools
      - run: npm run test:traceability
      - run: npm run test:recovery
      - run: npm run test:job-actions
      - run: npm run test:summary-scoping
      - run: npm run test:diarization
      - run: npm run test:egress
      - run: npm run test:local-api-client
      - run: npm run test:web-recordings
      - run: npm run test:device-authority
      - run: npm run test:audio-viz
      - run: npm run test:transcribe-concat

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Pulling a warm cache is useful for PR verification, but uploading
          # the Windows target directory can keep the required check open long
          # after all verification steps have passed.
          save-if: ${{ github.event_name != 'pull_request' }}
      # Formatting first: it needs no build, so a formatting-only failure
      # reports in seconds instead of after a full compile.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      # The native custody matrix runs on the Windows Rust job after formatting
      # and needs the same empty bundle-resource roots before its cargo-backed checks.
      - run: New-Item -ItemType Directory -Force .venv-whisper, runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # This suite invokes the Rust behavioral matrix. Keep it on the Rust
      # runner so it uses the platform/toolchain that owns that matrix rather
      # than requiring GTK/GLib development packages on the frontend runner.
      - run: npm run test:native-session-custody
      # tauri-build copies bundle.resources at build-script time (unconditionally,
      # regardless of the custom-protocol feature). .venv-whisper/ and runtime/ are
      # gitignored, so create them empty — empty dirs are skipped by ResourcePaths.
      - run: New-Item -ItemType Directory -Force .venv-whisper, runtime
      # `-D warnings` covers dead code too, so an unused item has to be either
      # removed or annotated with why it is kept. Every current exemption
      # carries that reason inline.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.12"
      - name: Run Rust library regression with test runtime
        shell: pwsh
        env:
          FUNG_MANIFEST_PATH: ${{ github.workspace }}\src-tauri\Cargo.toml
          FUNG_TARGET_DIR: ${{ runner.temp }}\fung-meeting-rust-target
          FUNG_SETUP_PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
        run: |
          $pythonPath = $env:FUNG_SETUP_PYTHON_PATH
          if ([string]::IsNullOrWhiteSpace($pythonPath) -or -not (Test-Path -LiteralPath $pythonPath -PathType Leaf)) {
            $pythonCommand = Get-Command -Name python -CommandType Application -ErrorAction SilentlyContinue
            if ($null -eq $pythonCommand) {
              throw 'setup-python did not provide a usable python-path and no python executable is available'
            }
            $pythonPath = $pythonCommand.Source
          }

          & "$env:GITHUB_WORKSPACE\scripts\meeting-intelligence-test-runtime.ps1" `
            -ManifestPath $env:FUNG_MANIFEST_PATH `
            -TargetDir $env:FUNG_TARGET_DIR `
            -PythonPath $pythonPath
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
