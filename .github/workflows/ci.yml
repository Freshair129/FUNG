name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:mobile
      - run: npm run test:design-system
      - run: npm run test:auth
      # Every suite runs. Six of these existed but were never wired in, so the
      # assertions added with the capture, custody and recovery work had never
      # executed on a runner — a suite that only passes locally is not a gate.
      - run: npm run test:backup-flow
      - run: npm run test:device-reconcile
      - run: npm run test:desktop-bootstrap
      - run: npm run test:external-tools
      - run: npm run test:traceability
      - run: npm run test:recovery
      - run: npm run test:job-actions
      - run: npm run test:summary-scoping
      - run: npm run test:diarization

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Formatting first: it needs no build, so a formatting-only failure
      # reports in seconds instead of after a full compile.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      # tauri-build copies bundle.resources at build-script time (unconditionally,
      # regardless of the custom-protocol feature). .venv-whisper/ and runtime/ are
      # gitignored, so create them empty — empty dirs are skipped by ResourcePaths.
      - run: New-Item -ItemType Directory -Force .venv-whisper, runtime
      # `-D warnings` covers dead code too, so an unused item has to be either
      # removed or annotated with why it is kept. Every current exemption
      # carries that reason inline.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
