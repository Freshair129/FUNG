<svg xmlns="http://www.w3.org/2000/svg" width="3968" height="1016" viewBox="0 0 3968 1016" role="img" aria-labelledby="title desc"><title id="title">FUNG low-fi interaction wireframes · 3 frames 1280x800</title><desc id="desc">Numbered layout zones H1-H4, L1-L4, R1-R4 with navigation and data scope; deliberately no polished cards, transcript fixture or copied assets. Candidate 0.1.0b.</desc><metadata>Created 2026-09-17T01:58:55+07:00; updated 2026-09-17T02:04:33+07:00; base c378af9fac3c00db063948f49f9ee857ebad9126.</metadata><style>text{font-family:"IBM Plex Sans Thai","DM Sans","Leelawadee UI",Tahoma,sans-serif}</style><rect width="3968" height="1016" fill="#FFFFFF"/><text x="32" y="34" font-size="22" font-weight="600" fill="#171918">FUNG / LOW-FI INFORMATION HIERARCHY + INTERACTION MAP</text><text x="32" y="60" font-size="14" font-weight="400" fill="#171918">0.1.0b CANDIDATE · 3 × 1280 × 800 · P1-B recommended, not selected · static document</text><g id="frame-0" transform="translate(32 80)">
