<text x="240" y="69" font-size="14" font-weight="400" fill="#171918">โครงร่างการโต้ตอบ · B = PROPOSED · เลือก A ได้ก่อนเขียนโค้ด</text>
<rect x="240" y="100" width="1008" height="170" fill="none" stroke="#707570" stroke-width="1.5"/><text x="256" y="130" font-size="19" font-weight="600" fill="#171918">H1 / จุดเริ่มต้น</text><text x="256" y="165" font-size="15" font-weight="400" fill="#171918">โครงการที่เลือก / สถานะในเครื่อง</text><text x="256" y="193" font-size="15" font-weight="400" fill="#171918">แจ้งผู้ร่วมประชุมก่อนอัด → [เริ่มประชุม] → เปิด Live</text><text x="256" y="221" font-size="15" font-weight="400" fill="#171918">[นำเข้าไฟล์] → เส้นทางเดิม; ไม่เริ่มงานอัตโนมัติ</text>
<rect x="240" y="294" width="488" height="180" fill="none" stroke="#707570" stroke-width="1.5"/><text x="256" y="324" font-size="19" font-weight="600" fill="#171918">H2 / กลับมาอ่านต่อ</text><text x="256" y="359" font-size="15" font-weight="400" fill="#171918">B: รายการบันทึกจริงของโครงการ → เลือกบันทึก</text><text x="256" y="387" font-size="15" font-weight="400" fill="#171918">A: บันทึกปัจจุบันจาก activeRecordingId เท่านั้น</text><text x="256" y="415" font-size="15" font-weight="400" fill="#171918">Reopen = อ่าน durable recording; ไม่เริ่มอัดซ้ำ</text>
<rect x="752" y="294" width="496" height="180" fill="none" stroke="#707570" stroke-width="1.5"/><text x="768" y="324" font-size="19" font-weight="600" fill="#171918">H3 / เครื่องมือเดิม</text><text x="768" y="359" font-size="15" font-weight="400" fill="#171918">[งานและโครงการ] → สถานะงานที่มีอยู่</text><text x="768" y="387" font-size="15" font-weight="400" fill="#171918">[ตั้งค่า] → โมเดล / บัญชี / สำรอง / Local API</text><text x="768" y="415" font-size="15" font-weight="400" fill="#171918">[จับคู่] → รหัสและอุปกรณ์ที่เชื่อถือ</text>
<rect x="240" y="500" width="1008" height="178" fill="none" stroke="#707570" stroke-width="1.5"/><text x="256" y="530" font-size="19" font-weight="600" fill="#171918">H4 / เส้นทางและผลลัพธ์</text><text x="256" y="565" font-size="15" font-weight="400" fill="#171918">เมื่อกำลังอัด: เตือนก่อนออกจากหน้า; คง session owner คนเดียว</text><text x="256" y="593" font-size="15" font-weight="400" fill="#171918">ว่าง: สอนเริ่มงาน / โหลด: รออ่าน / error: ลองใหม่ ไม่เปลี่ยนเป็นว่าง</text><text x="256" y="621" font-size="15" font-weight="400" fill="#171918">ลิงก์พื้นที่เดิมรักษา Capture / Transcript / Summary / Runtime</text>
<rect x="240" y="704" width="1008" height="72" fill="none" stroke="#707570" stroke-width="1.5" stroke-dasharray="7 5"/>
