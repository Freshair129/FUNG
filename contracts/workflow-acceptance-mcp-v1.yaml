version: "1.0.1"
updated_at: "2026-10-20"
scope: "developer-only functional acceptance and timing for FUNG's local audio workflow"
transport:
  type: "stdio"
  protocol_versions:
    - "2026-07-28"
    - "2025-11-25"
server:
  name: "fung-workflow-mcp"
  entrypoint: "scripts/fung-workflow-mcp.mjs"
  local_only: true
  network_listener: false
  subprocess_allowlist:
    - "powershell.exe scripts/run-workflow-acceptance.ps1"
    - "cargo test --offline --locked --lib upload_transcribes_with_the_real_runtime -- --ignored --nocapture"
tools:
  - name: "fung.workflow.describe"
    read_only: true
    input: {}
    output: "Readiness, fixed synthetic fixture hash, pinned runtime presence, and resource policy."
  - name: "fung.workflow.run_acceptance"
    read_only: false
    input: {}
    output: "PASS/FAIL, functional stage results, diagnostic-only keyword score, timings, and evidence paths."
    writes:
      - "A new unique folder under G:/AI-Studio/verification/fung-workflow-mcp"
    concurrency: "One run at a time; a file lock protects the shared Cargo target directory."
  - name: "fung.workflow.list_runs"
    read_only: true
    input:
      limit: "optional integer 1..20"
    output: "Recent run summaries and timings; stale RUNNING receipts older than the runner timeout plus 60 seconds are reported as STALE; never returns audio bytes or transcript text."
acceptance:
  fixture_id: "standalone-english-48k"
  fixture_sha256: "493E7CFAD303F6FF3032E0777B811317F48F6C08E74A23DEE779977F674B933F"
  runtime:
    transcription_profile: "cpu"
    compute_type: "int8"
    model: "large-v3-turbo"
    revision: "0a363e9161cbc7ed1431c9597a8ceaf0c4f78fcf"
  functional_steps:
    - "POST the pinned fixture to the production loopback import route."
    - "Wait for the durable transcription job to complete and require a nonempty transcript."
    - "Read playback bytes and compare them byte-for-byte with the import."
    - "Edit a transcript segment using the production storage path."
    - "Render SRT, VTT and WAV; verify the correction and audio bytes."
    - "Close the listener and Genesis store, reopen them, and verify job, transcript, recording and export inventory."
  quality_gate: "diagnostic_only"
resource_policy:
  microphone: "never accessed"
  user_audio: "never read"
  gpu: "not used"
  ollama: "not touched"
  network: "stdio MCP plus the test's ephemeral 127.0.0.1 listener only"
security:
  - "No arbitrary shell command, fixture path, output path, model, or environment override is accepted from MCP arguments."
  - "Run identifiers are generated by the server and validated by the PowerShell runner."
  - "The runner refuses an existing evidence directory and verifies the fixture SHA-256 before execution."
  - "Failure logs stay on disk; MCP results do not include transcript text or raw audio."
  - "Cancellation terminates the fixed runner process tree."
