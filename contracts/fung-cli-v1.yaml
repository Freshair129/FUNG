version: "0.1.0b"
updated_at: "2026-07-05T10:35:00+07:00"
binary: "fung"
rules:
  - "CLI calls the same local API contract instead of duplicating business logic."
  - "Human mode prints tables or compact text."
  - "Machine mode uses --json and prints one JSON object or array to stdout."
  - "Errors go to stderr and return non-zero exit codes."
commands:
  - command: "fung doctor"
    purpose: "check loopback API, SQLite WAL, microphone, and model providers"
    exit_codes:
      0: "healthy"
      1: "runtime degraded or dependency missing"
  - command: "fung project list [--json]"
    purpose: "list projects"
  - command: "fung project create --name <name> --storage-path <path> [--json]"
    purpose: "create project"
  - command: "fung project show --project-id <id> [--json]"
    purpose: "show project detail"
  - command: "fung record start --project-id <id> [--input-path <file>] [--json]"
    purpose: "start microphone or import recording job"
  - command: "fung record pause --recording-id <id> [--json]"
    purpose: "pause active recording"
  - command: "fung record resume --recording-id <id> [--json]"
    purpose: "resume paused recording"
  - command: "fung record stop --recording-id <id> [--json]"
    purpose: "stop recording"
  - command: "fung record recover --recording-id <id> [--json]"
    purpose: "recover chunk metadata after interruption"
  - command: "fung transcript show --project-id <id> [--json]"
    purpose: "show transcript and speakers"
  - command: "fung transcript rename-speaker --speaker-id <id> --name <value> [--json]"
    purpose: "rename speaker label"
  - command: "fung layer list --recording-id <id> [--json]"
    purpose: "list source and derived audio layers"
  - command: "fung job list [--project-id <id>] [--status <value>] [--json]"
    purpose: "list jobs"
  - command: "fung job retry --job-id <id> [--json]"
    purpose: "retry failed job"
  - command: "fung job cancel --job-id <id> [--json]"
    purpose: "cancel running job"
  - command: "fung summary list --project-id <id> [--json]"
    purpose: "list generated summaries"
  - command: "fung intent list --project-id <id> [--json]"
    purpose: "list intent inferences"
  - command: "fung export create --project-id <id> --kind <wav|mp3|txt|srt|vtt|json> [--source-layer-id <id>] [--json]"
    purpose: "create export job"
output_shapes:
  standard_success:
    ok: true
    data: "command-specific payload"
  standard_error:
    ok: false
    error: "string machine code"
    message: "string"
    retryable: "boolean"
